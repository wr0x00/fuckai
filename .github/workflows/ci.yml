name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # httpx 是 fastapi.testclient 的硬依赖，requirements.txt 里没有（只在测试时用到），这里单独装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt httpx

      - name: Check Python syntax
        run: python -m compileall -q fuckai web.py web test

      - name: Smoke-test the web app
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from web.app import app
          response = TestClient(app).get("/health")
          assert response.status_code == 200, response.text
          assert response.json().get("ok") is True, response.json()
          print("/health smoke test passed")
          PY
